spring.application.name=demo

# ==========================================================
#  DATABASE  --  le due variabili delle credenziali
#  Sono gli unici due valori da cambiare se cambi utente/password in pgAdmin.
# ==========================================================
db.username=postgres
db.password=1234

spring.datasource.url=jdbc:postgresql://localhost:5432/ChatBot
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/aggiorna le tabelle da solo al primo avvio.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Metti a true se vuoi vedere le query in console.
spring.jpa.show-sql=false

server.port=8080

# ==========================================================
#  OPENROUTER
#  La chiave NON si scrive qui: si legge dalla variabile d'ambiente
#  OPENROUTER_API_KEY, cosi' non finisce mai dentro a git.
# ==========================================================
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.default-model=nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
openrouter.app-title=ChatBot U6W1D3
openrouter.referer=http://localhost:5173

# Lista DI RISERVA per la tendina.
# Normalmente l'elenco viene scaricato da OpenRouter (ModelCatalogService) e
# contiene solo modelli gratuiti. Questi valori si usano solo se il primo
# download non riesce, p.es. senza connessione.
openrouter.models[0].id=nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
openrouter.models[0].label=NVIDIA: Nemotron 3 Nano Omni 30B

# ==========================================================
#  SICUREZZA / JWT
#  Il segreto firma i token: chi lo conosce puo' creare token validi.
#  In sviluppo va bene il default qui sotto; in produzione si usa solo
#  la variabile d'ambiente JWT_SECRET. Minimo 32 caratteri.
# ==========================================================
security.jwt.secret=${JWT_SECRET:chiave-di-sviluppo-u6w1d3-cambiami-in-produzione-32+}
security.jwt.expiration-minutes=120
